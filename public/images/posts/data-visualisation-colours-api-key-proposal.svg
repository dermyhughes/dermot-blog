<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">Proposed API-key comparison chart</title><desc id="desc">Conceptual comparison view with three selected keys from forty available. Checkout service, Mobile app and Reporting have readable example names, identifier suffixes, direct labels and different markers. A searchable key selector replaces the paginated colour legend. An Overview tab would show total usage. All data and names are invented; this is a proposal awaiting testing.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="1020" rx="0" fill="#ffffff" stroke="none"/>
