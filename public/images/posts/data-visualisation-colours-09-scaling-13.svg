 stroke="none"/><text x="1111.1538461538462" y="760.1" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">69</text><text x="1111.1538461538462" y="942" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">13</text><text x="48" y="987" font-size="18" fill="#526178" font-weight="400" text-anchor="start">Stable category assignments drive reuse. Filtering does not restart the palette or remove a pattern.</text></g></svg>