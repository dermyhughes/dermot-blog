hor="start">Score</text><text x="48" y="987" font-size="18" fill="#526178" font-weight="400" text-anchor="start">Allocation example only. How many categories belong in the view still needs testing.</text><rect x="101.4" y="813.2" width="48" height="100.8" rx="3" fill="#335cff" stroke="none"/><text x="125.4" y="804.2" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">48</text><text x="125.4" y="942" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">01</text><rect x="172.2" y="777.5" width="48" height="136.5" rx="3" fill="#ea6500" stroke="none"/><text x="196.2" y="768.5" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">65</text><text x="196.2" y="942" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">02</text><rect x="243.0" y="832.1" width="48" height="81.9" rx="3" fill="#009b48" stroke="none"/><text x="267.0" y="823.1" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">39</text><text x="267.0" y="942" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">03</text><rect x="313.8" y="741.8" width="48" height="172.2" rx="3" fill="#ed3b4f" stroke="none"/><text x="337.8" y="732.8" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">82</text><text x="337.8" y="942" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">04</text><rect x="384.6" y="800.6" width="48" height="113.4" rx="3" fill="#00979e" stroke="none"/><text x="408.6" y="791.6" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">54</text><text x="408.6" y="942" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">05</text><rect x="455.4" y="764.9" width="48" height="149.1" rx="3" fill="#d62aaa" stroke="none"/><text x="479.4" y="755.9" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">71</text><text x="479.4" y="942" font-size="16" fill="#17243b" font-weight="500" text-anchor="middle">06</text><rect x="526.2" y="819.5" w