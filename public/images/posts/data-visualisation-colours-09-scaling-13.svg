<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">Fifteen categories, twelve fixed colours</title><desc id="desc">Illustrative allocation for fifteen categories. Categories 01 to 12 keep their twelve solid fills. Category 13 reuses the blue from 01, category 14 the orange from 02, and category 15 the green from 03, each with diagonal hatching. All bars have direct labels and invented scores. The allocation still needs evaluation in the chart where it will be used.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="1020" rx="0" fill="#ffffff" stroke="none"/><defs><pattern id="h0" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#335cff" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#ffffff" stroke-width="2"/></pattern><pattern id="h1" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#ea6500" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#17243b" stroke-width="2"/></pattern><pattern id="h2" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#009b48" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#17243b" stroke-width="2"/></pattern><pattern id="h3" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#ed3b4f" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#17243b" stroke-width="2"/></pattern><pattern id="h4" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#00979e" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#17243b" stroke-width="2"/></pattern><pattern id="h5" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12