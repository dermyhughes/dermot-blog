<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="522" viewBox="0 0 1200 522" role="img" aria-labelledby="title desc"><title id="title">Chart-specific overflow treatments</title><desc id="desc">The same blue is used for category 01 and category 13. Filled marks distinguish them using solid fill and diagonal hatching. Lines use solid and dashed strokes. Points use circle and square markers. Labels identify both categories in every example. These alternatives address the repeated hue; they are not a universal readability guarantee.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="522" rx="0" fill="#ffffff" stroke="none"/><defs><pattern id="h0" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#335cff" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#ffffff" stroke-width="2"/></pattern></defs><text x="48" y="45" font-size="17" fill="#526178" font-weight="600" text-anchor="start">PROPOSAL / THE FIRST REUSED COLOUR</text><text x="48" y="99" font-size="38" fill="#17243b" font-weight="600" text-anchor="start">One colour. Two category identities.</text><text x="48" y="141" font-size="22" fill="#526178" font-weight="400" text-anchor="start">Apply the extra cue where that chart can render it clearly.</text><path d="M48 171 L1152 171" stroke="#dce2eb" stroke-width="1" fill="none"/><text x="48" y="219" font-size="27" fill="#17243b" font-weight="600" text-anchor="start">Filled marks</text><text x="48" y="252" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Solid / diagonal hatch</text><text x="48" y="318" font-size="20" fill="#17243b" font-weight="600" text-anchor="start">01</text><rect x="105" y="290" width="225" height="44" rx="5" fill="#335cff" stroke="none"/><text x="48" y="405" font-size="20" fill="#17243b" font-weight="600" text-anchor="start">13</text><rect x="105" y="377" width="225" height="44" rx="5" fill="url(#h0)" stroke="none"/><text x="426" y="219" font-size="27" fill="#17243b" font-weight="600" text-anchor="start">Lines</text><text x="426" y="252" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Solid / dashed stroke</text><text x="426" y="318" font-size="20" fill="#17243b" font-weight="600" text-anchor="start">01</text><path d="M483 312 H708" stroke="#335cff" stroke-width="5" stroke-dasharray=""/><text x="426" y="405" font-size="20" fill="#17243b" font-weight="600" text-anchor="start">13</text><path d="M483 399 H708" stroke="#335cff" stroke-width="5" stroke-dasharray="12 7"/><text x="804" y="219" font-size="27" fill="#17243b" font-weight="600" text-anchor="start">Points</text><text x="804" y="252" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Circle / square marker</text><text x="804" y="318" font-size="20" fill="#17243b" font-weight="600" text-anchor="start">01</text><circle cx="876" cy="312" r="10" fill="#335cff"/><circle cx="938" cy="312" r="10" fill="#335cff"/><circle cx="1000" cy="312" r="10" fill="#335cff"/><circle cx="1062" cy="312" r="10" fill="#335cff"/><text x="804" y="405" font-size="20" fill="#17243b" font-weight="600" text-anchor="start">13</text><rect x="866" y="389" width="20" height="20" rx="2" fill="#335cff" stroke="none"/><rect x="928" y="389" width="20" height="20" rx="2" fill="#335cff" stroke="none"/><rect x="990" y="389" width="20" height="20" rx="2" fill="#335cff" stroke="none"/><rect x="1052" y="389" width="20" height="20" rx="2" fill="#335cff" stroke="none"/><text x="48" y="481" font-size="20" fill="#526178" font-weight="400" text-anchor="start">These are alternatives for different marks; a series does not need all three treatments at once.</text></g></svg>