<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="title desc"><title id="title">Twelve fixed candidate colours in two themes</title><desc id="desc">Twelve illustrative fixed values per theme, selected through the preceding exploration. This proposal treats all twelve as curated inputs. There is no generated colour extension. All categorical values exceed 3:1 against their stated surfaces; that check does not establish distinguishability or chart accessibility.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="752" rx="0" fill="#ffffff" stroke="none"/><text x="48" y="44" font-size="17" fill="#526178" font-weight="600" text-anchor="start">PROPOSAL / TWELVE COLOURS TO CURATE</text><text x="48" y="98" font-size="38" fill="#17243b" font-weight="600" text-anchor="start">Twelve colours. Two considered themes.</text><text x="48" y="139" font-size="22" fill="#526178" font-weight="400" text-anchor="start">All values are fixed inputs. Overflow changes the treatment, not the colour set.</text><path d="M48 172 L1152 172" stroke="#dce2eb" stroke-width="1" fill="none"/><rect x="610" y="190" width="558" height="475" rx="12" fill="#142239" stroke="none"/><text x="48" y="230" font-size="27" fill="#17243b" font-weight="600" text-anchor="start">Light · #FFFFFF</text><text x="48" y="267" font-size="17" fill="#526178" font-weight="400" text-anchor="start">01</text><rect x="48" y="279" width="118" height="52" rx="5" fill="#335cff" stroke="none"/><text x="107" y="358" font-size="18" fill="#17243b" font-weight="400" text-anchor="middle">#335CFF</text><text x="180" y="267" font-size="17" fill="#526178" font-weight="400" text-anchor="start">02</text><rect x="180" y="279" width="118" height="52" rx="5" fill="#ea6500" stroke="none"/><text x="239" y="358" font-size="18" fill="#17243b" font-weight="400" text-anchor="middle">#EA6500</text><text x="312" y="267" font-size="17" fill="#526178" f