<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">Matching lightness while keeping vivid colour</title><desc id="desc">Top: orange and violet both have HSL saturation 80 percent and lightness 55 percent, yet orange looks lighter. Bottom: each colour keeps its own Oklab hue and chroma, with only OKLCH lightness changed to 0.65. Both remain vivid and fit sRGB without gamut mapping. Neutral greys preserve the rendered colours’ relative luminance, subject to rounding; the lower pair is closer but not identical. Luminance is not a complete model of perceived lightness. This is a calculated illustration, not a user-perception experiment.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="1020" rx="0" fill="#ffffff" stroke="none"/><text x="48" y="48" font-size="18" fill="#526178" font-weight="600" text-anchor="start">COLOUR LAB / PERCEPTION</text><text x="48" y="101" font-size="40" fill="#17243b" font-weight="600" text-anchor="start">Same lightness setting. Different result.</text><text x="48" y="141" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Keep the vivid colours. Adjust the lightness.</text><line x1="48" y1="172" x2="1152" y2="172" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="48" y="218" font-size="29" fill="#17243b" font-weight="600" text-anchor="start">01 / HSL: both say 55% lightness</text><text x="48" y="258" font-size="17" fill="#526178" font-weight="600" text-anchor="start">COLOUR</text><text x="660" y="258" font-size="17" fill="#526178" font-weight="600" text-anchor="start">LUMINANCE-PRESERVING GREYS</text><rect x="48" y="277" width="240" height="126" rx="7" fill="#e87d30" stroke="#c6cbd4"/><rect x="660" y="277" width="240" height="126" rx="7" fill="#999999" stroke="#c6cbd4"/><text x="168" y="433" font-size="19" fill="#17243b" font-weight="400" text-anchor="middle">hsl(25° 80% 55%)</text><text x="780" y="433" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Y = 32.0%</text><rect x="300" y="277" width="240" height="126" rx="7" fill="#ba30e8" stroke="#c6cbd4"/><rect x="912" y="277" width="240" height="126" rx="7" fill="#777777" stroke="#c6cbd4"/><text x="420" y="433" font-size="19" fill="#17243b" font-weight="400" text-anchor="middle">hsl(285° 80% 55%)</text><text x="1032" y="433" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Y = 18.4%</text><line x1="568" y1="340" x2="632" y2="340" stroke="#526178" stroke-width="2" stroke-dasharray=""/><path d="M622 333 L632 340 L622 347" fill="none" stroke="#526178" stroke-width="2"/><text x="48" y="485" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Same HSL lightness. Orange looks lighter than violet.</text><line x1="48" y1="511" x2="1152" y2="511" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="48" y="550" font-size="29" fill="#17243b" font-weight="600" text-anchor="start">02 / OKLCH: both have lightness 0.65</text><text x="48" y="590" font-size="17" fill="#526178" font-weight="600" text-anchor="start">COLOUR</text><text x="660" y="590" font-size="17" fill="#526178" font-weight="600" text-anchor="start">LUMINANCE-PRESERVING GREYS</text><rect x="48" y="609" width="240" height="126" rx="7" fill="#d86e1c" stroke="#c6cbd4"/><rect x="660" y="609" width="240" height="126" rx="7" fill="#8b8b8b" stroke="#c6cbd4"/><text x="168" y="765" font-size="19" fill="#17243b" font-weight="400" text-anchor="middle">L 0.65 · C 0.158 · h 51.9°</text><text x="780" y="765" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Y = 25.8%</text><rect x="300" y="609" width="240" height="126" rx="7" fill="#c944f8" stroke="#c6cbd4"/><rect x="912" y="609" width="240" height="126" rx="7" fill="#858585" stroke="#c6cbd4"/><text x="420" y="765" font-size="19" fill="#17243b" font-weight="400" text-anchor="middle">L 0.65 · C 0.263 · h 315.6°</text><text x="1032" y="765" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Y = 23.3%</text><line x1="568" y1="672" x2="632" y2="672" stroke="#526178" stroke-width="2" stroke-dasharray=""/><path d="M622 665 L632 672 L622 679" fill="none" stroke="#526178" stroke-width="2"/><text x="48" y="817" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Hue and chroma kept. Only OKLCH lightness changes.</text><line x1="48" y1="854" x2="1152" y2="854" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="48" y="891" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Y is relative luminance: 0% = black, 100% = white. Greys preserve Y, subject to rounding.</text><text x="48" y="923" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Luminance helps explain this example; it is not a complete model of perceived lightness.</text><text x="48" y="955" font-size="19" fill="#526178" font-weight="400" text-anchor="start">All samples fit sRGB. Compare within each pair: HSL L and OKLCH L are different scales.</text><text x="48" y="987" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Calculated using Oklab conversions. These explain the controls, not a chart palette.</text></g></svg>