<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">Equal HSL lightness does not mean equal visual lightness</title><desc id="desc">Top: pure yellow and pure blue both have HSL saturation 100 percent and lightness 50 percent. Their relative luminances are 92.78 percent and 7.22 percent. Neutral greys with those luminances make the difference visible. Bottom: the yellow and blue Oklab hue directions are retained with OKLCH lightness 0.65 and chroma 0.12; luminance-preserving greys are much closer, but not identical. Greys use linear-light sRGB luminance, not Oklab desaturation. This is an explanatory colour calculation, not a user-perception experiment.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="1020" rx="0" fill="#ffffff" stroke="none"/><text x="48" y="48" font-size="18" fill="#526178" font-weight="600" text-anchor="start">COLOUR LAB / PERCEPTION</text><text x="48" y="101" font-size="40" fill="#17243b" font-weight="600" text-anchor="start">The same setting. A different lightness.</text><text x="48" y="141" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Compare how light the colours look, rather than which one catches your eye.</text><line x1="48" y1="172" x2="1152" y2="172" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="48" y="218" font-size="29" fill="#17243b" font-weight="600" text-anchor="start">01 / HSL: both say 50% lightness</text><text x="48" y="258" font-size="17" fill="#526178" font-weight="600" text-anchor="start">COLOUR</text><text x="660" y="258" font-size="17" fill="#526178" font-weight="600" text-anchor="start">LUMINANCE-PRESERVING GREYS</text><rect x="48" y="277" width="240" height="126" rx="7" fill="#ffff00" stroke="#c6cbd4"/><rect x="660" y="277" width="240" height="126" rx="7" fill="#f7f7f7" stroke="#c6cbd4"/><text x="168" y="433" font-size="19" fill="#17243b" font-weight="400" text-anchor="middle">hsl(60° 100% 50%)</text><text x="780" y="433" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Y = 92.8%</text><rect x="300" y="277" width="240" height="126" rx="7" fill="#0000ff" stroke="#c6cbd4"/><rect x="912" y="277" width="240" height="126" rx="7" fill="#4c4c4c" stroke="#c6cbd4"/><text x="420" y="433" font-size="19" fill="#17243b" font-weight="400" text-anchor="middle">hsl(240° 100% 50%)</text><text x="1032" y="433" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Y = 7.2%</text><line x1="568" y1="340" x2="632" y2="340" stroke="#526178" stroke-width="2" stroke-dasharray=""/><path d="M622 333 L632 340 L622 347" fill="none" stroke="#526178" stroke-width="2"/><text x="48" y="485" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Same HSL lightness value. Yellow is much lighter than blue.</text><line x1="48" y1="511" x2="1152" y2="511" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="48" y="550" font-size="29" fill="#17243b" font-weight="600" text-anchor="start">02 / OKLCH: match lightness deliberately</text><text x="48" y="590" font-size="17" fill="#526178" font-weight="600" text-anchor="start">COLOUR</text><text x="660" y="590" font-size="17" fill="#526178" font-weight="600" text-anchor="start">LUMINANCE-PRESERVING GREYS</text><rect x="48" y="609" width="240" height="126" rx="7" fill="#949532" stroke="#c6cbd4"/><rect x="660" y="609" width="240" height="126" rx="7" fill="#909090" stroke="#c6cbd4"/><text x="168" y="765" font-size="19" fill="#17243b" font-weight="400" text-anchor="middle">oklch(0.65 0.12 109.8°)</text><text x="780" y="765" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Y = 28.0%</text><rect x="300" y="609" width="240" height="126" rx="7" fill="#698dd8" stroke="#c6cbd4"/><rect x="912" y="609" width="240" height="126" rx="7" fill="#8e8e8e" stroke="#c6cbd4"/><text x="420" y="765" font-size="19" fill="#17243b" font-weight="400" text-anchor="middle">oklch(0.65 0.12 264.1°)</text><text x="1032" y="765" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Y = 27.0%</text><line x1="568" y1="672" x2="632" y2="672" stroke="#526178" stroke-width="2" stroke-dasharray=""/><path d="M622 665 L632 672 L622 679" fill="none" stroke="#526178" stroke-width="2"/><text x="48" y="817" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Matched OKLCH lightness. The two greys are now much closer.</text><line x1="48" y1="854" x2="1152" y2="854" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="48" y="891" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Y is relative luminance: 0% = black, 100% = white. Greys preserve Y, subject to rounding.</text><text x="48" y="923" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Luminance helps explain this example; it is not a complete model of perceived lightness.</text><text x="48" y="955" font-size="19" fill="#526178" font-weight="400" text-anchor="start">All samples fit sRGB. Compare within each pair: HSL L and OKLCH L are different scales.</text><text x="48" y="987" font-size="19" fill="#526178" font-weight="400" text-anchor="start">Reference: W3C CSS Color 4, section 7. These are explanatory samples, not chart colours.</text></g></svg>