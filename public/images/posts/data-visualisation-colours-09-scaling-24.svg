</text><path d="M48 169 L1152 169" stroke="#dce2eb" stroke-width="1" fill="none"/><text x="48" y="207" font-size="17" fill="#526178" font-weight="600" text-anchor="start">FIRST PASS / THE TWELVE AUTHORED COLOURS</text><rect x="48" y="228" width="80" height="66" rx="6" fill="#335cff" stroke="none"/><text x="88" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">01</text><rect x="140" y="228" width="80" height="66" rx="6" fill="#ea6500" stroke="none"/><text x="180" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">02</text><rect x="232" y="228" width="80" height="66" rx="6" fill="#009b48" stroke="none"/><text x="272" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">03</text><rect x="324" y="228" width="80" height="66" rx="6" fill="#ed3b4f" stroke="none"/><text x="364" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">04</text><rect x="416" y="228" width="80" height="66" rx="6" fill="#00979e" stroke="none"/><text x="456" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">05</text><rect x="508" y="228" width="80" height="66" rx="6" fill="#d62aaa" stroke="none"/><text x="548" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">06</text><rect x="600" y="228" width="80" height="66" rx="6" fill="#008ecb" stroke="none"/><text x="640" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">07</text><rect x="692" y="228" width="80" height="66" rx="6" fill="#883df2" stroke="none"/><text x="732" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">08</text><rect x="784" y="228" width="80" height="66" rx="6" fill="#6f9700" stroke="none"/><text x="824" y="320" font-size="19" fill="#17243b" font-weight="600" text-anchor="middle">09</text><rect x="876" y="228" width="80" height="66" rx="6" fill="#d900ef" stroke="none"/><text x="916" y="320" font-size="19" fill="#17243b" font-weight=