<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">24 categories, twelve fixed colours</title><desc id="desc">Illustrative allocation for 24 categories. Categories 01 to 12 use twelve fixed solid fills. Categories 13 to 24, if present, reuse the corresponding colour with diagonal hatching. No category is reassigned as the count grows. A directly labelled bar chart uses invented scores. This is a demonstration of assignment, not a validated readable category limit.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="1020" rx="0" fill="#ffffff" stroke="none"/><defs><pattern id="h0" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#335cff" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#ffffff" stroke-width="2"/></pattern><pattern id="h1" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#ea6500" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#17243b" stroke-width="2"/></pattern><pattern id="h2" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#009b48" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#17243b" stroke-width="2"/></pattern><pattern id="h3" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#ed3b4f" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#17243b" stroke-width="2"/></pattern><pattern id="h4" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" rx="0" fill="#00979e" stroke="none"/><path d="M-4 4 L4 -4 M0 12 L12 0 M8 16 L16 8" stroke="#17243b" stroke-width="2"/></pattern><pattern id="h5" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12"