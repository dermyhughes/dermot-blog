<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Filter the data, keep the identity</title><desc id="desc">Palette slots use zero-based numbering. Initially France uses orange slot 00, Germany purple slot 01, Spain teal slot 02. After removing France, array-position assignment moves Germany to orange slot 00 and Spain to purple slot 01. A stored mapping preserves Germany in slot 01 and Spain in slot 02.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#ffffff" stroke="none"/><text x="48" y="48" font-size="18" fill="#526178" font-weight="600" text-anchor="start">IDENTITY / FILTERING</text><text x="48" y="101" font-size="40" fill="#17243b" font-weight="600" text-anchor="start">Filter the data. Keep the identity.</text><text x="48" y="141" font-size="23" fill="#526178" font-weight="400" text-anchor="start">A stable palette still needs a stable category-to-slot mapping.</text><line x1="48" y1="172" x2="1152" y2="172" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="350" y="210" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Before filtering</text><text x="785" y="210" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">France removed</text><text x="48" y="269" font-size="25" fill="#17243b" font-weight="600" text-anchor="start">Array position</text><text x="48" y="304" font-size="21" fill="#526178" font-weight="400" text-anchor="start">Slots shift</text><rect x="350" y="249" width="26" height="26" rx="4" fill="#ea6500" stroke="none"/><text x="392" y="272" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">France</text><text x="574" y="272" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 00</text><rect x="350" y="305" width="26" height="26" rx="4" fill="#883df2" stroke="none"/><text x="392" y="328" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Germany</text><text x="574" y="328" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 01</text><rect x="350" y="361" width="26" height="26" rx="4" fill="#00979e" stroke="none"/><text x="392" y="384" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Spain</text><text x="574" y="384" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 02</text><rect x="785" y="249" width="26" height="26" rx="4" fill="#ea6500" stroke="none"/><text x="827" y="272" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Germany</text><text x="1009" y="272" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 00</text><rect x="785" y="305" width="26" height="26" rx="4" fill="#883df2" stroke="none"/><text x="827" y="328" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Spain</text><text x="1009" y="328" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 01</text><line x1="48" y1="441" x2="1152" y2="441" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="48" y="507" font-size="25" fill="#17243b" font-weight="600" text-anchor="start">Stored mapping</text><text x="48" y="542" font-size="21" fill="#526178" font-weight="400" text-anchor="start">Slots retained</text><rect x="350" y="487" width="26" height="26" rx="4" fill="#ea6500" stroke="none"/><text x="392" y="510" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">France</text><text x="574" y="510" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 00</text><rect x="350" y="543" width="26" height="26" rx="4" fill="#883df2" stroke="none"/><text x="392" y="566" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Germany</text><text x="574" y="566" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 01</text><rect x="350" y="599" width="26" height="26" rx="4" fill="#00979e" stroke="none"/><text x="392" y="622" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Spain</text><text x="574" y="622" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 02</text><rect x="785" y="487" width="26" height="26" rx="4" fill="#883df2" stroke="none"/><text x="827" y="510" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Germany</text><text x="1009" y="510" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 01</text><rect x="785" y="543" width="26" height="26" rx="4" fill="#00979e" stroke="none"/><text x="827" y="566" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Spain</text><text x="1009" y="566" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Slot 02</text><line x1="48" y1="688" x2="1152" y2="688" stroke="#dce2eb" stroke-width="1" stroke-dasharray=""/><text x="48" y="727" font-size="23" fill="#526178" font-weight="400" text-anchor="start">Same categories. Same palette. Different assignment contract.</text></g></svg>